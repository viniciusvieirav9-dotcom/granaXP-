<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GranaXP</title>
<style>
:root{--bg:#0a110d;--card:#121c16;--card2:#182419;--tx:#e8f2ea;--mut:#8da596;--ac:#a3e635;--acd:#0a110d;--bd:#223027;--red:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f7f2;--card:#fff;--card2:#eaf1e8;--tx:#13201a;--mut:#51675a;--ac:#4d7c0f;--acd:#fff;--bd:#d5e0d3;--red:#b91c1c;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f7f2;--card:#fff;--card2:#eaf1e8;--tx:#13201a;--mut:#51675a;--ac:#4d7c0f;--acd:#fff;--bd:#d5e0d3;--red:#b91c1c;color-scheme:light}
:root[data-theme="dark"]{--bg:#0a110d;--card:#121c16;--card2:#182419;--tx:#e8f2ea;--mut:#8da596;--ac:#a3e635;--acd:#0a110d;--bd:#223027;--red:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar{max-width:1000px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 14px;overflow-x:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;white-space:nowrap;cursor:pointer;background:none;border:0;color:var(--tx)}
.logo b{color:var(--ac)}
nav{display:flex;gap:4px;margin-left:auto}
nav button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:12px;cursor:pointer;white-space:nowrap;min-height:40px;transition:.2s}
nav button.on{background:var(--ac);color:var(--acd);border-color:var(--ac);font-weight:700}
.btn.p{background:var(--ac);color:var(--acd);border-color:var(--ac);font-weight:700}
.btn:hover,nav button:hover{transform:translateY(-1px)}
.btn.d{color:var(--red)}
main{max-width:1000px;margin:auto;padding:16px 14px 40px}
h1{font-size:clamp(30px,7vw,48px);line-height:1.1;margin:0 0 10px}h2{margin:22px 0 10px;font-size:22px}h3{margin:0 0 8px;font-size:16px}
.mut{color:var(--mut)}.ac{color:var(--ac)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 6px 24px #0003}
.big{font-size:26px;font-weight:800}
.prog{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .6s}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);min-height:42px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut)}
.hero{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:center;padding:14px 0}
.demo{position:relative}.demo .tag{position:absolute;top:-10px;right:12px;background:var(--ac);color:var(--acd);font-weight:700}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--ac);color:var(--ac)}
.lock{opacity:.45;filter:grayscale(1)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ac);color:var(--acd);padding:12px 18px;border-radius:14px;font-weight:700;transition:.4s;z-index:20;max-width:90%}
#toast.s{transform:translate(-50%,0)}
svg text{fill:var(--mut);font-size:11px}
footer{max-width:1000px;margin:auto;padding:0 14px 30px;color:var(--mut);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gear{background:none;border:0;color:var(--mut);opacity:.35;cursor:pointer;font-size:15px;padding:10px;float:right}.gear:hover,.gear:focus-visible{opacity:1}
details{border-bottom:1px solid var(--bd);padding:10px 0}details:last-child{border:0}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}.mod .card{width:100%;max-width:380px;position:relative}
.err{color:var(--red);font-size:14px;min-height:20px;margin:6px 0}.note{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:12px}
</style>
</head>
<body>
<header><div class="bar">
<button class="logo" onclick="go('home')" aria-label="GranaXP início"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#a3e635"/><path d="M9 21l5-6 4 4 6-9" stroke="#0a110d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Grana<b>XP</b></button>
<nav id="nav"></nav>
<button class="btn" id="th" onclick="theme()" aria-label="Alternar tema">◐</button>
</div></header>
<main id="app"></main>
<footer>GranaXP é gratuito e não pede e-mail. Seus dados ficam na sua conta, protegidos por login, e nunca são compartilhados com outros usuários; você pode excluí-los quando quiser. Os resultados do simulador são estimativas, não garantias de rendimento. Nenhum sistema é totalmente seguro.<button class="gear" onclick="openAdmin()" aria-label="Configurações" title="Configurações">⚙</button></footer>
<div id="toast" role="status"></div><div id="modal"></div>
<script>
const CATS=['Alimentação','Transporte','Estudos','Lazer','Jogos e entretenimento','Compras','Contas','Salário ou mesada','Presentes','Outros'];
const LV=[[0,'Iniciante'],[100,'Explorador'],[250,'Estrategista'],[500,'Planejador'],[900,'Mestre da Grana']];
const ACH=[['first','Primeira Movimentação','Registre um lançamento',s=>s.tx.length>=1],['seven','Sete Movimentações','Registre 7 lançamentos',s=>s.tx.length>=7],['goal','Primeiro Objetivo Criado','Crie um objetivo',s=>s.goals.length>=1],['done','Meta Concluída','Conclua um objetivo',s=>s.goals.some(g=>g.done)]];
const CH=[['c1','Registrar uma movimentação hoje',20,true,s=>s.tx.some(t=>t.date===today())],['c2','Criar um objetivo financeiro',30,false,s=>s.goals.length>0],['c3','Contribuir para um objetivo',25,false,s=>s.goals.some(g=>g.hist.length)],['c4','Aprender: reserva de emergência costuma cobrir de 3 a 6 meses de gastos essenciais',15,false,s=>true]];
let S={name:'',tx:[],goals:[],xp:0,log:[],ach:[],claimed:{},xpday:{}},view='home';


const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function lvl(){let i=0;LV.forEach((l,k)=>{if(S.xp>=l[0])i=k});const a=LV[i][0],b=LV[i+1]?LV[i+1][0]:null;return{i,name:LV[i][1],pct:b?(S.xp-a)/(b-a)*100:100,next:b}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),2600)}
function gain(n,why,key){const k=key+today();const c=S.xpday[k]||0;if(c>=3){return}S.xpday[k]=c+1;const before=lvl().i;S.xp+=n;S.log.unshift([today(),why,n]);S.log=S.log.slice(0,30);toast('+'+n+' XP · '+why);if(lvl().i>before)setTimeout(()=>toast('Subiu de nível: '+lvl().name+'!'),1800)}
function checkAch(){ACH.forEach(a=>{if(!S.ach.includes(a[0])&&a[3](S)){S.ach.push(a[0]);setTimeout(()=>toast('Conquista: '+a[1]),900)}})}
function done(){checkAch();save();render()}
function go(v){view=v;render();scrollTo(0,0)}
function theme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'}
const TABS=[['home','Início'],['painel','Painel'],['lanc','Lançamentos'],['obj','Objetivos'],['des','Desafios'],['sem','Semana'],['sim','Simulador'],['perfil','Perfil']];
function sums(list){let r=0,d=0;list.forEach(t=>t.type==='r'?r+=t.val:d+=t.val);return{r,d,s:r-d}}
function monthTx(off=0){const d=new Date();d.setMonth(d.getMonth()+off);const p=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return S.tx.filter(t=>t.date.startsWith(p))}
function render(){if(S.acc)document.documentElement.style.setProperty('--ac',S.acc);
$('#nav').innerHTML=TABS.map(t=>`<button class="${view===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
$('#app').innerHTML=({home:vHome,painel:vPainel,lanc:vLanc,obj:vObj,des:vDes,sim:vSim,sem:vSem,perfil:vPerfil})[view]();
if(view==='sim')runSim();
}
function vHomeOld(){return `<section class="hero"><div><span class="badge">100% gratuito</span><h1>Sua grana. Seu jogo. <span class="ac">Seu próximo nível.</span></h1><p class="mut">Uma maneira mais inteligente e divertida de organizar seu dinheiro, acompanhar suas metas e evoluir financeiramente.</p><p>${U?`<button class="btn p" onclick="go('painel')">Ir para o painel</button>`:`<button class="btn p" onclick="openAuth(1)">Começar gratuitamente</button> <button class="btn" onclick="openAuth(0)">Entrar na minha conta</button>`} <button class="btn" onclick="go('sim')">Experimentar o simulador</button></p></div>
<div class="card demo"><span class="tag">Dados de demonstração</span><h3>Nível 3 · Estrategista</h3><div class="prog"><i style="width:68%"></i></div><p class="mut" style="margin:0 0 10px">340 / 500 XP</p><svg viewBox="0 0 300 90" width="100%" aria-hidden="true"><g fill="var(--ac)">${[30,48,40,62,55,74,66].map((h,i)=>`<rect x="${12+i*40}" y="${84-h}" width="26" height="${h}" rx="6"/>`).join('')}</g></svg><div class="row"><span>Meta: violão</span><b>R$ 420 de R$ 800</b></div><div class="row"><span>🏆 Primeira Semana Organizada</span><span class="tag">nova</span></div></div></section>
<h2>Como funciona</h2><div class="grid"><div class="card"><h3>1. Registre</h3><p class="mut">Lance receitas e despesas em segundos e veja o saldo atualizar.</p></div><div class="card"><h3>2. Ganhe XP</h3><p class="mut">Hábitos de organização rendem XP, níveis e conquistas. Nunca se perde XP.</p></div><div class="card"><h3>3. Conquiste metas</h3><p class="mut">Guarde para o que importa e acompanhe o progresso com clareza.</p></div></div>
${faq()}`}
function vPainel(){const m=monthTx(),a=sums(m),all=sums(S.tx),L=lvl(),h=new Date().getHours(),g=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
const cat={};m.filter(t=>t.type==='d').forEach(t=>cat[t.cat]=(cat[t.cat]||0)+t.val);const mx=Math.max(1,...Object.values(cat));
return `<h2 style="margin-top:6px">${S.av||''} ${g}${S.name?', '+esc(S.name):''}!</h2><p class="mut" style="margin-top:0">${phrase()}</p>
<div class="card" style="margin-bottom:12px"><label for="nm">Nome de exibição</label><input id="nm" value="${esc(S.name)}" maxlength="30" onchange="S.name=this.value.trim();save();render()"></div>
<div class="grid"><div class="card"><span class="mut">Saldo atual</span><div class="big ${all.s<0?'':'ac'}">${fmt(all.s)}</div></div><div class="card"><span class="mut">Receitas do mês</span><div class="big">${fmt(a.r)}</div></div><div class="card"><span class="mut">Despesas do mês</span><div class="big">${fmt(a.d)}</div></div></div>
<div class="grid" style="margin-top:12px"><div class="card"><h3>Nível ${L.i+1} · ${L.name}</h3><div class="prog"><i style="width:${L.pct}%"></i></div><span class="mut">${S.xp} XP${L.next?' · faltam '+(L.next-S.xp)+' para o próximo nível':' · nível máximo'}</span></div>
<div class="card"><h3>Gastos por categoria (mês)</h3>${Object.keys(cat).length?Object.entries(cat).map(([k,v])=>`<div style="font-size:14px">${k} <span class="mut">${fmt(v)}</span></div><div class="prog"><i style="width:${v/mx*100}%"></i></div>`).join(''):'<p class="mut">Nenhuma despesa neste mês ainda.</p>'}</div></div>
<div class="grid" style="margin-top:12px"><div class="card"><h3>Conquistas</h3>${ACH.map(x=>`<div class="row ${S.ach.includes(x[0])?'':'lock'}"><span>🏆 ${x[1]}</span><span class="tag">${x[2]}</span></div>`).join('')}</div>
<div class="card"><h3>Histórico de XP</h3>${S.log.length?S.log.slice(0,6).map(l=>`<div class="row"><span>${esc(l[1])}</span><b class="ac">+${l[2]}</b></div>`).join(''):'<p class="mut">Registre algo para começar a ganhar XP.</p>'}</div></div>
<p><button class="btn p" onclick="go('lanc')">+ Lançamento</button> <button class="btn" onclick="go('obj')">+ Objetivo</button></p>`}
let q='',fc='',ft='';
function vLanc(){const list=S.tx.filter(t=>(!fc||t.cat===fc)&&(!ft||t.type===ft)&&(!q||t.desc.toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));const s=sums(list),prev=sums(monthTx(-1)),cur=sums(monthTx());
return `<h2 style="margin-top:6px">Lançamentos</h2><form class="card" onsubmit="addTx(event)"><div class="grid"><div><label for="d">Descrição</label><input id="d" required maxlength="60"></div><div><label for="v">Valor (R$)</label><input id="v" type="number" step="0.01" min="0.01" required inputmode="decimal"></div><div><label for="ty">Tipo</label><select id="ty"><option value="d">Despesa</option><option value="r">Receita</option></select></div><div><label for="c">Categoria</label><select id="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label for="dt">Data</label><input id="dt" type="date" value="${today()}" required></div></div><p><button class="btn p">Adicionar</button></p></form>
<div class="grid" style="margin:12px 0"><div><label for="q">Pesquisar</label><input id="q" value="${esc(q)}" oninput="q=this.value;keep('q')"></div><div><label for="ft">Tipo</label><select id="ft" onchange="ft=this.value;render()"><option value="">Todos</option><option value="r" ${ft==='r'?'selected':''}>Receitas</option><option value="d" ${ft==='d'?'selected':''}>Despesas</option></select></div><div><label for="fc">Categoria</label><select id="fc" onchange="fc=this.value;render()"><option value="">Todas</option>${CATS.map(c=>`<option ${fc===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
<div class="card"><p class="mut" style="margin-top:0">Filtro: receitas ${fmt(s.r)} · despesas ${fmt(s.d)} · saldo ${fmt(s.s)}<br>Despesas deste mês vs. mês anterior: ${fmt(cur.d)} / ${fmt(prev.d)}</p>${list.length?list.map(t=>`<div class="row"><div><b>${esc(t.desc)}</b><br><span class="tag">${t.cat}</span> <span class="mut">${t.date.split('-').reverse().join('/')}</span></div><div style="text-align:right"><b style="color:${t.type==='r'?'var(--ac)':'var(--red)'}">${t.type==='r'?'+':'−'}${fmt(t.val)}</b><br><button class="btn d" style="min-height:32px;padding:3px 10px" onclick="delTx('${t.id}',this)">Excluir</button></div></div>`).join(''):'<p class="mut">Nenhum lançamento por aqui ainda. Que tal adicionar o primeiro?</p>'}</div>`}
function keep(id){render();const e=$('#'+id);e.focus();e.setSelectionRange(e.value.length,e.value.length)}
function addTx(e){e.preventDefault();S.tx.push({id:'t'+Date.now(),desc:$('#d').value.trim(),val:Math.round(parseFloat($('#v').value)*100)/100,type:$('#ty').value,cat:$('#c').value,date:$('#dt').value});gain(10,'Movimentação registrada','tx');done()}
function delTx(id,b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirmar?';return}S.tx=S.tx.filter(t=>t.id!==id);done()}
function vObj(){return `<h2 style="margin-top:6px">Objetivos</h2><form class="card" onsubmit="addGoal(event)"><div class="grid"><div><label for="gn">Nome</label><input id="gn" required maxlength="40" placeholder="Ex.: violão"></div><div><label for="gv">Valor desejado (R$)</label><input id="gv" type="number" min="1" step="0.01" required></div><div><label for="gi">Ícone</label><select id="gi">${['🎯','📱','💻','🎸','✈️','🎓'].map(i=>`<option>${i}</option>`).join('')}</select></div></div><p><button class="btn p">Criar objetivo</button></p></form>
<div class="grid" style="margin-top:12px">${S.goals.map((g,i)=>{const acc=g.hist.reduce((a,b)=>a+b,0),p=Math.min(100,acc/g.val*100);return `<div class="card"><h3>${g.icon} ${esc(g.name)} ${g.done?'<span class="badge">concluída</span>':g.paused?'<span class="badge">pausada</span>':''}</h3><div class="prog"><i style="width:${p}%"></i></div><span class="mut">${fmt(acc)} de ${fmt(g.val)} · faltam ${fmt(Math.max(0,g.val-acc))}</span>${g.done||g.paused?'':`<div style="display:flex;gap:6px;margin-top:8px"><input id="ct${i}" type="number" min="0.01" step="0.01" placeholder="Valor" aria-label="Contribuição"><button class="btn p" onclick="contrib(${i})">Guardar</button></div>`}<p class="mut" style="font-size:13px">${g.hist.length} contribuição(ões). Guardar para uma meta não conta como receita.</p>${g.done?'':`<button class="btn" style="min-height:32px" onclick="pauseGoal(${i})">${g.paused?'Retomar':'Pausar'}</button> <button class="btn" style="min-height:32px" onclick="finishGoal(${i})">Concluir</button> `}<button class="btn d" style="min-height:32px" onclick="delGoal(${i},this)">Excluir</button></div>`}).join('')||'<div class="card"><p class="mut">Nenhum objetivo ainda. Crie o primeiro e ganhe XP!</p></div>'}</div>`}
function addGoal(e){e.preventDefault();S.goals.push({name:$('#gn').value.trim(),val:parseFloat($('#gv').value),icon:$('#gi').value,hist:[],done:false});gain(30,'Objetivo criado','goal');done()}
function contrib(i){const v=parseFloat($('#ct'+i).value);if(!(v>0))return toast('Informe um valor válido');const g=S.goals[i];g.hist.push(v);gain(15,'Progresso na meta','ct');if(g.hist.reduce((a,b)=>a+b,0)>=g.val&&!g.done){g.done=true;gain(50,'Meta concluída','fin')}done()}
function delGoal(i,b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirmar?';return}S.goals.splice(i,1);done()}
function vDes(){return `<h2 style="margin-top:6px">Desafios</h2><p class="mut">Opcionais e sem penalidade. Ganhe XP no seu ritmo.</p><div class="grid">${CH.map(c=>{const key=c[0]+(c[3]?today():''),got=S.claimed[key],ok=c[4](S);return `<div class="card"><h3>${c[1]}</h3><p class="mut">Recompensa: ${c[2]} XP · ${got?'concluído':ok?'pronto para resgatar':'em andamento'}</p><button class="btn ${ok&&!got?'p':''}" ${ok&&!got?'':'disabled'} onclick="claim('${c[0]}')">${got?'Resgatado ✓':'Resgatar XP'}</button></div>`}).join('')}</div>`}
function claim(id){const c=CH.find(x=>x[0]===id),key=id+(c[3]?today():'');if(S.claimed[key]||!c[4](S))return;S.claimed[key]=1;S.xp+=c[2];S.log.unshift([today(),'Desafio concluído',c[2]]);toast('+'+c[2]+' XP · desafio concluído');done()}
function phrase(){const P=['Pequenos passos também levam a grandes objetivos.','Seu progresso não precisa ser igual ao de ninguém.','Cada revisão é uma oportunidade de aprender.','O próximo nível começa com uma boa decisão.'];return S.tx.length?P[new Date().getDate()%P.length]:'Organizar é o primeiro passo para decidir melhor.'}
function pauseGoal(i){S.goals[i].paused=!S.goals[i].paused;done()}
function finishGoal(i){const g=S.goals[i];if(g.done)return;g.done=true;gain(50,'Meta concluída','fin');done()}
function ds(n){const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wk(o){return S.tx.filter(t=>t.date>=ds(o*7+6)&&t.date<=ds(o*7))}
function vSem(){const a=wk(0),b=wk(1),x=sums(a),y=sums(b),cat={};a.filter(t=>t.type==='d').forEach(t=>cat[t.cat]=(cat[t.cat]||0)+t.val);const top=Object.entries(cat).sort((p,q)=>q[1]-p[1]).slice(0,3),mx=Math.max(1,top.length?top[0][1]:1),xp=S.log.filter(l=>l[0]>=ds(6)).reduce((s,l)=>s+l[2],0),dc=S.log.filter(l=>l[0]>=ds(6)&&l[1]==='Desafio concluído').length;return `<h2 style="margin-top:6px">Resumo semanal</h2><p class="mut">Últimos 7 dias. Aqui o objetivo é entender, sem julgamentos.</p><div class="grid"><div class="card"><span class="mut">Entradas</span><div class="big ac">${fmt(x.r)}</div></div><div class="card"><span class="mut">Saídas</span><div class="big">${fmt(x.d)}</div></div><div class="card"><span class="mut">Diferença</span><div class="big">${fmt(x.s)}</div></div></div><div class="grid" style="margin-top:12px"><div class="card"><h3>Categorias com maior participação</h3>${top.length?top.map(([k,v])=>`<div style="font-size:14px">${k} <span class="mut">${fmt(v)}</span></div><div class="prog"><i style="width:${v/mx*100}%"></i></div>`).join(''):'<p class="mut">Sem saídas registradas nesta semana.</p>'}</div><div class="card"><h3>Sua semana</h3><div class="row"><span>XP conquistado</span><b class="ac">${xp}</b></div><div class="row"><span>Desafios concluídos</span><b>${dc}</b></div><div class="row"><span>Metas em andamento</span><b>${S.goals.filter(g=>!g.done&&!g.paused).length}</b></div><p class="mut" style="font-size:13px">${b.length?'Saídas na semana anterior: '+fmt(y.d)+'.':'Ainda não há dados suficientes da semana anterior para comparar.'}</p></div></div><p><button class="btn p" onclick="revisar()">Marcar como revisado (+10 XP)</button></p>`}
function revisar(){const k='sem'+today();if(S.claimed[k])return toast('Você já revisou hoje');S.claimed[k]=1;gain(10,'Resumo semanal revisado','sem');done()}
const AV=['🙂','😎','🚀','🎮','🌱','🦊'],AC=[['Lima','#a3e635'],['Ciano','#22d3ee'],['Laranja','#fb923c'],['Rosa','#f472b6']];
function vPerfil(){const L=lvl();return `<h2 style="margin-top:6px">${S.av||'🙂'} Perfil</h2><div class="grid"><div class="card"><h3>Nível ${L.i+1} · ${L.name}</h3><div class="prog"><i style="width:${L.pct}%"></i></div><span class="mut">${S.xp} XP · ${S.ach.length} conquista(s)</span></div><div class="card"><h3>Avatar</h3>${AV.map(a=>`<button class="btn" style="font-size:22px" onclick="S.av='${a}';done()" aria-label="Avatar ${a}">${a}</button>`).join(' ')}</div><div class="card"><h3>Cor de destaque</h3>${AC.map(c=>`<button class="btn" style="border-color:${c[1]}" onclick="S.acc='${c[1]}';done()">${c[0]}</button>`).join(' ')}</div><div class="card"><h3>Meus dados</h3><p class="mut" style="font-size:13px">Exclui sua conta e todos os dados associados. Não dá para desfazer.</p><label for="dp">Sua senha, para confirmar</label><input id="dp" type="password" autocomplete="current-password"><p><button class="btn d" onclick="delAll(this)">Excluir minha conta</button></p></div></div>`}
function delAll(b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirmar exclusão?';return}S={name:'',tx:[],goals:[],xp:0,log:[],ach:[],claimed:{},xpday:{}};try{localStorage.removeItem('gxp')}catch(e){}document.documentElement.style.removeProperty('--ac');toast('Dados excluídos');render()}
function vSim(){return `<h2 style="margin-top:6px">Simulador</h2><div class="card"><div class="grid"><div><label for="s0">Valor inicial (R$)</label><input id="s0" type="number" value="0" min="0" oninput="runSim()"></div><div><label for="s1">Contribuição (R$)</label><input id="s1" type="number" value="10" min="0" oninput="runSim()"></div><div><label for="s2">Frequência</label><select id="s2" onchange="runSim()"><option value="52" selected>Semanal</option><option value="12">Mensal</option></select></div><div><label for="s3">Prazo (meses)</label><input id="s3" type="number" value="12" min="1" max="600" oninput="runSim()"></div><div><label for="s4">Rendimento hipotético (% ao ano)</label><input id="s4" type="number" value="6" min="0" step="0.1" oninput="runSim()"></div><div><label for="s5">Gastos planejados (R$)</label><input id="s5" type="number" value="0" min="0" oninput="runSim()"></div><div><label for="s6">Objetivo (R$)</label><input id="s6" type="number" value="0" min="0" oninput="runSim()"></div></div></div><div id="simout" style="margin-top:12px"></div>`}
function proj(v0,c,f,m,r){const n=Math.round(m/12*f),i=Math.pow(1+r/100,1/f)-1;let b=v0,pts=[b];for(let k=1;k<=n;k++){b=b*(1+i)+c;pts.push(b)}return{pts,fin:b,tot:v0+c*n}}
function runSim(){const v=id=>Math.max(0,parseFloat($('#'+id).value)||0),v0=v('s0'),c=v('s1'),f=+$('#s2').value,m=Math.max(1,v('s3')),r=v('s4'),gp=v('s5'),ob=v('s6');
const A=proj(v0,c,f,m,r),B=proj(v0,c*1.5,f,m,r),mx=Math.max(1,B.fin),line=(p,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${p.pts.map((y,k)=>(30+k/(p.pts.length-1||1)*260).toFixed(1)+','+(130-y/mx*115).toFixed(1)).join(' ')}"/>`;
$('#simout').innerHTML=`<div class="grid"><div class="card"><span class="mut">Total contribuído</span><div class="big">${fmt(A.tot)}</div></div><div class="card"><span class="mut">Rendimentos estimados</span><div class="big">${fmt(A.fin-A.tot)}</div></div><div class="card"><span class="mut">Valor final projetado</span><div class="big ac">${fmt(A.fin)}</div></div></div>
<div class="card" style="margin-top:12px"><span class="mut">Valor restante após gastos planejados</span><div class="big">${fmt(A.fin-gp)}</div>${ob?`<div class="prog"><i style="width:${Math.min(100,Math.max(0,(A.fin-gp)/ob*100))}%"></i></div><span class="mut">${Math.min(100,Math.max(0,Math.round((A.fin-gp)/ob*100)))}% do objetivo de ${fmt(ob)}</span>`:''}</div><div class="card" style="margin-top:12px"><svg viewBox="0 0 300 150" width="100%" role="img" aria-label="Gráfico de evolução">${line(A,'var(--ac)')}${line(B,'var(--mut)')}<text x="30" y="146">início</text><text x="250" y="146">${m} meses</text></svg><p style="margin:0"><span class="ac">━</span> Cenário atual · <span class="mut">━ E se eu aumentasse 50%? ${fmt(B.fin)}</span></p></div>
<p class="mut" style="font-size:13px">Premissas: juros compostos com taxa anual hipotética convertida para o período, aportes ao fim de cada período, sem impostos, taxas ou inflação. São estimativas, não garantias de rendimento.</p>`}
let U=null,notices=[],cfg={},AD=null;
const DEF=()=>({name:'',tx:[],goals:[],xp:0,log:[],ach:[],claimed:{},xpday:{}});
const PRIV=['painel','lanc','obj','des','sem','perfil'];
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(d.error||'Erro de conexão'),{status:r.status});return d}
let st;function save(){if(!U)return;clearTimeout(st);st=setTimeout(()=>api('PUT','/api/state',S).catch(()=>toast('Não foi possível salvar. Verifique a conexão.')),400)}
function render(){
if(!U&&PRIV.includes(view))view='home';
if(view==='admin'&&!AD)view='home';
const r=document.documentElement,ac=(U&&S.acc)||cfg.accent;ac?r.style.setProperty('--ac',ac):r.style.removeProperty('--ac');
const tabs=U?[['home','Início'],['painel','Painel'],['lanc','Lançamentos'],['obj','Objetivos'],['des','Desafios'],['sem','Semana'],['sim','Simulador'],['perfil','Perfil']]:[['home','Início'],['sim','Simulador']];
$('#nav').innerHTML=tabs.map(t=>`<button class="${view===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+(U?'<button onclick="logout()">Sair</button>':'<button class="p" onclick="openAuth(0)">Entrar</button>');
$('#app').innerHTML=view==='admin'?vAdmin():({home:vHome,painel:vPainel,lanc:vLanc,obj:vObj,des:vDes,sem:vSem,sim:vSim,perfil:vPerfil})[view]();
if(view==='sim')runSim();
}
function vHome(){return notices.map(n=>`<div class="note">📢 ${esc(n.msg)}</div>`).join('')+vHomeOld()}
function faq(){const Q=[['O GranaXP é gratuito?','Sim. Todos os recursos são gratuitos, sem planos pagos, assinaturas ou cobranças.'],['Preciso de e-mail ou telefone?','Não. Você cria a conta só com nome de usuário e senha.'],['E se eu esquecer a senha?','Como não pedimos e-mail, não há recuperação automática. Guarde sua senha em um lugar seguro.'],['Duas pessoas podem ter a mesma senha?','Podem. O que não pode se repetir é o nome de usuário: ele é único, e é isso que impede que alguém entre na conta de outra pessoa por coincidência.'],['Meus dados ficam seguros?','Seus lançamentos ficam na sua conta, protegidos por login, e ninguém vê os dados de outra pessoa. Nenhum sistema é 100% seguro, então nunca registre senhas ou números de cartão.'],['Como funciona o XP?','Você ganha XP ao registrar movimentações, criar metas, guardar dinheiro e revisar a semana. Nunca perde XP, e gastar com necessidades não prejudica você.'],['O simulador garante rendimento?','Não. Ele faz apenas estimativas com os valores que você informar.'],['Posso apagar minha conta?','Sim, a qualquer momento, no Perfil. Todos os dados associados são excluídos.']];return '<h2>Perguntas frequentes</h2><div class="card">'+Q.map(q=>`<details><summary>${q[0]}</summary><p class="mut">${q[1]}</p></details>`).join('')+'</div>'}
function closeModal(){$('#modal').innerHTML=''}
const X='<button type="button" class="btn" style="position:absolute;top:10px;right:10px;min-height:32px;padding:2px 10px" onclick="closeModal()" aria-label="Fechar">×</button>';
function openAuth(reg){$('#modal').innerHTML=`<div class="mod" role="dialog" aria-modal="true"><form class="card" onsubmit="submitAuth(event,${reg})">${X}<h3>${reg?'Criar minha conta':'Entrar na minha conta'}</h3><label for="u">Nome de usuário</label><input id="u" name="u" required autocomplete="username" maxlength="20">${reg?'<label for="d">Nome de exibição (opcional)</label><input id="d" name="d" maxlength="30">':''}<label for="p">Senha</label><input id="p" name="p" type="password" required autocomplete="${reg?'new-password':'current-password'}">${reg?'<label for="c">Confirmar senha</label><input id="c" name="c" type="password" required autocomplete="new-password"><p class="mut" style="font-size:13px">Sem e-mail, não há recuperação automática de senha. Guarde a sua.</p>':''}<div class="err" id="err" role="alert"></div><button class="btn p" style="width:100%">${reg?'Criar conta':'Entrar'}</button><p style="text-align:center;margin:10px 0 0"><button type="button" class="btn" onclick="openAuth(${reg?0:1})">${reg?'Já tenho conta':'Criar uma conta'}</button></p></form></div>`;$('#u').focus()}
async function submitAuth(e,reg){e.preventDefault();const f=e.target,err=m=>{$('#err').textContent=m};if(reg&&f.p.value!==f.c.value)return err('As senhas não conferem.');const b={username:f.u.value,password:f.p.value};if(reg)b.displayName=f.d.value;try{const d=await api('POST',reg?'/api/register':'/api/login',b);U=d.user;S=Object.assign(DEF(),d.state||{});closeModal();view='painel';render();toast(reg?'Conta criada! Bem-vindo(a)':'Bem-vindo(a) de volta')}catch(er){err(er.message)}}
async function logout(){try{await api('POST','/api/logout')}catch(e){}U=null;S=DEF();view='home';render()}
async function delAll(b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirmar exclusão?';return}try{await api('DELETE','/api/me',{password:$('#dp').value});U=null;S=DEF();view='home';render();toast('Conta excluída')}catch(er){toast(er.message);b.dataset.c='';b.textContent='Excluir minha conta'}}
function openAdmin(){$('#modal').innerHTML=`<div class="mod" role="dialog" aria-modal="true"><form class="card" onsubmit="adminLogin(event)">${X}<h3>Acesso do administrador</h3><label for="ap">Senha</label><input id="ap" name="ap" type="password" required autocomplete="off"><div class="err" id="err" role="alert"></div><button class="btn p" style="width:100%">Entrar</button></form></div>`;$('#ap').focus()}
async function adminLogin(e){e.preventDefault();const f=e.target;try{await api('POST','/api/admin/login',{password:f.ap.value});AD=await api('GET','/api/admin/stats');closeModal();view='admin';render();scrollTo(0,0)}catch(er){$('#err').textContent=er.message;f.ap.value='';f.ap.focus()}}
async function adm(m,u,b){try{await api(m,u,b);AD=await api('GET','/api/admin/stats');render()}catch(er){if(er.status===401){AD=null;view='home';render();toast('Sessão do administrador expirada')}else toast(er.message)}}
function vAdmin(){return `<h2 style="margin-top:6px">Painel do administrador</h2><div class="grid"><div class="card"><span class="mut">Contas cadastradas</span><div class="big ac">${AD.total}</div></div><div class="card"><span class="mut">Novas contas (7 dias)</span><div class="big">${AD.new7}</div></div><div class="card"><span class="mut">Ativas: 24h / 7d / 30d</span><div class="big">${AD.a1} / ${AD.a7} / ${AD.a30}</div></div></div>
<div class="grid" style="margin-top:12px"><div class="card"><h3>Avisos públicos</h3><form onsubmit="event.preventDefault();adm('POST','/api/admin/notices',{msg:this.m.value})"><input name="m" maxlength="200" placeholder="Escreva um aviso" aria-label="Novo aviso" required><p><button class="btn p">Publicar aviso</button></p></form>${AD.notices.map(n=>`<div class="row"><span>${esc(n.msg)}</span><button class="btn d" style="min-height:32px" onclick="delNotice(${n.id},this)">Excluir</button></div>`).join('')||'<p class="mut">Nenhum aviso publicado.</p>'}</div>
<div class="card"><h3>Cor de destaque do site</h3>${[['Lima','#a3e635'],['Ciano','#22d3ee'],['Laranja','#fb923c'],['Rosa','#f472b6'],['Padrão','']].map(c=>`<button class="btn" onclick="setAccent('${c[1]}')">${c[0]}</button>`).join(' ')}</div>
<div class="card"><h3>Alterar senha do painel</h3><form onsubmit="chgPass(event)"><label for="pa">Senha atual</label><input id="pa" name="a" type="password" required autocomplete="current-password"><label for="pb">Nova senha (mínimo 8 caracteres)</label><input id="pb" name="b" type="password" required minlength="8" autocomplete="new-password"><label for="pc">Confirmar nova senha</label><input id="pc" name="c" type="password" required autocomplete="new-password"><div class="err" id="perr" role="alert"></div><button class="btn p">Salvar nova senha</button></form></div>
<div class="card"><h3>Registro de ações</h3>${AD.audit.map(a=>`<div class="row"><span>${esc(a.act)}</span><span class="mut">${new Date(a.at).toLocaleString('pt-BR')}</span></div>`).join('')||'<p class="mut">Sem ações ainda.</p>'}</div></div>
<p class="mut" style="font-size:13px">Por privacidade, este painel mostra só números agregados. Saldos, lançamentos e metas dos usuários não aparecem aqui.</p><p><button class="btn" onclick="adminOut()">Sair do painel</button></p>`}
function delNotice(id,b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirmar?';return}adm('DELETE','/api/admin/notices/'+id)}
async function setAccent(a){await adm('POST','/api/admin/accent',{accent:a});cfg.accent=a;render()}
async function chgPass(e){e.preventDefault();const f=e.target,pe=$('#perr');if(f.b.value!==f.c.value){pe.textContent='As senhas novas não conferem.';return}try{await api('POST','/api/admin/password',{current:f.a.value,next:f.b.value});f.reset();pe.textContent='';toast('Senha alterada com sucesso')}catch(er){pe.textContent=er.message}}
async function adminOut(){try{await api('POST','/api/admin/logout')}catch(e){}AD=null;view='home';render()}
async function boot(){try{cfg=await api('GET','/api/config');notices=cfg.notices||[]}catch(e){}try{const d=await api('GET','/api/me');U=d.user;S=Object.assign(DEF(),d.state||{})}catch(e){U=null;S=DEF()}render()}

boot();
</script>
</body>
</html>
